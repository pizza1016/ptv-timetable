publish:
  stage: deploy
#  needs:
#    - job: build
#      artifacts: true
#  id_tokens:
#    PYPI_ID_TOKEN:
#      aud: pypi
  script:
#    # Adapted from https://docs.pypi.org/trusted-publishers/using-a-publisher/
#    # Install dependencies
#    - python -m pip install --upgrade pip
#    - python -m pip install --upgrade twine
#
#    # Upload to GitLab Package Registry
#    - python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi --username gitlab-ci-token --password ${CI_JOB_TOKEN} --verbose dist/*
#
#    # Upload to Python Package Index
#    # With no token specified, twine will use Trusted Publishing
#    - python -m twine upload --repository-url https://upload.pypi.org/legacy/ --skip-existing --verbose dist/*

    # Export details for release creation
    - package_version=$(python -c "import tomllib; f = open(\"pyproject.toml\", \"rb\"); print(tomllib.load(f)[\"project\"][\"version\"]); f.close();")
    - echo "PACKAGE_VERSION=${package_version}" >> variables.env
    - curl -s -S --fail-with-body "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_version=${package_version}&sort=desc" -o "registry.json"
    - package_id=$(python -c "import json; f = open(\"registry.json\", \"r\", encoding=\"utf-8\"); print(json.load(f)[0][\"id\"]); f.close();")
    - echo "PACKAGE_ID={package_id}" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env
  interruptible: false
  when: manual
  manual_confirmation: "Publish new version to Python Package Index and GitLab Package Registry?"

release_job:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: publish
      artifacts: true
  before_script: []
  script:
    - echo
  release:
    tag_name: "${PACKAGE_VERSION}"
    description: "./CHANGELOG.md"
    assets:
      links:
        - name: "GitLab Package Registry"
          url: "${CI_PROJECT_URL}/-/packages/${PACKAGE_ID}"
          link_type: package
        - name: "Python Package Index"
          url: "https://pypi.org/project/ptv-timetable/${PACKAGE_VERSION}"
          link_type: package
  interruptible: true

docs:
  stage: deploy
  needs: []
  script:
    - python -m pip install sphinx aiohttp aiolimiter ratelimit requests tzdata  # need to import third-party libraries used by project
    - cd docs
    - sphinx-build -n --color source build
  pages:
    publish: docs/build
  interruptible: true
  when: manual
  manual_confirmation: "Update docs?"
